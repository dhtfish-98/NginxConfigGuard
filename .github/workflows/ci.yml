name: Nginx static policy validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ${{ runner.temp }}/Build/NginxConfigGuard/源码
    env:
      TMPDIR: ${{ runner.temp }}/Build/临时
      TMP: ${{ runner.temp }}/Build/临时
      TEMP: ${{ runner.temp }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ runner.temp }}/Build/缓存/pip
      npm_config_cache: ${{ runner.temp }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ runner.temp }}/Build/缓存/ruff
      GOCACHE: ${{ runner.temp }}/Build/缓存/go
      GOMODCACHE: ${{ runner.temp }}/Build/缓存/go-mod
      GOTMPDIR: ${{ runner.temp }}/Build/临时
      GOPATH: ${{ runner.temp }}/Build/缓存/go-path
      GOBIN: ${{ runner.temp }}/Build/输出/go-bin
      CARGO_HOME: ${{ runner.temp }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ runner.temp }}/Build/缓存/xdg
      CCACHE_DIR: ${{ runner.temp }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ runner.temp }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ runner.temp }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage tracked source and restored inputs in external Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci --build-root "${{ runner.temp }}/Build"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tool and build dependencies
        run: python -m pip install . build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Run targeted tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify installed CLI
        run: |
          nginx-config-guard --version
          nginx-config-guard --help
