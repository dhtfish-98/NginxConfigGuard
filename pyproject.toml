[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-config-guard"
version = "0.1.5"
description = "Bounded offline HTTP Nginx configuration scopes and four defensive policies"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
nginx-config-guard = "nginx_config_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nginx-config-guard" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md"]
